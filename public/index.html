<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VJ Audio & BPM Sync Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    button {
      background-color: #1db954;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    button:disabled { background-color: #555; }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }
    .bpm-box {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
    }
    .bpm-num { font-size: 2.2rem; font-weight: bold; color: #1db954; }
    .info-item { margin-bottom: 8px; }
    .info-label { font-size: 0.75rem; color: #aaa; }
    .info-value { font-size: 1.0rem; font-weight: 600; }
    
    /* エネルギー変化グラフ (Canvas) */
    .graph-container {
      margin-top: 6px;
      background: #000;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #333;
    }
    canvas {
      width: 100%;
      height: 60px;
      display: block;
    }

    /* アートワーク & 歌詞表示レイアウト */
    .lyrics-wrapper {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      align-items: stretch;
    }
    .album-art {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #333;
      display: none;
    }
    .lyrics-container {
      flex: 1;
      background: #000;
      border-radius: 8px;
      padding: 10px 12px;
      height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #ddd;
      border: 1px solid #333;
      box-sizing: border-box;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #aaa;
      background: #181818;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .ratio-highlight { color: #1db954; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VJ Audio Tracker</h1>
    <div class="btn-group">
      <button id="startBtn">解析開始</button>
      <button id="stopBtn" style="background-color: #e74c3c;" disabled>停止</button>
    </div>
    <div id="status" style="font-size:0.85rem; color:#aaa;">「解析開始」を押すとBPM・楽曲識別を開始します</div>

    <div class="card">
      <div class="bpm-box">
        <div>
          <div class="info-label">マイク解析BPM</div>
          <div id="realtimeBpmVal" class="bpm-num">--</div>
        </div>
        <div>
          <div class="info-label">原曲DB BPM</div>
          <div id="originalBpmVal" class="bpm-num" style="color: #3498db;">--</div>
        </div>
      </div>

      <div class="info-item">
        <div class="info-label">曲名</div>
        <div id="titleVal" class="info-value">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">アーティスト</div>
        <div id="artistVal" class="info-value">-</div>
      </div>

      <!-- 楽曲エネルギー構造グラフ -->
      <div class="info-label" style="margin-top:10px;">エネルギー構造 & 現在再生位置</div>
      <div class="graph-container">
        <canvas id="energyCanvas" width="380" height="60"></canvas>
      </div>

      <!-- アートワーク & 自動同期歌詞 -->
      <div class="info-label" style="margin-top:10px;">自動同期歌詞</div>
      <div class="lyrics-wrapper">
        <img id="albumArt" class="album-art" src="" alt="Album Art">
        <div id="lyricsBox" class="lyrics-container">曲が識別されるとここに歌詞が表示されます。</div>
      </div>
      
      <div class="status-bar">
        <span>スクロール追従速度:</span>
        <span id="syncRatioVal" class="ratio-highlight">1.00x (標準)</span>
      </div>
    </div>
  </div>

  <script>
    let audioCtx, analyser, microphone, scriptNode;
    let lastBeatTime = 0;
    let beatIntervals = [];
    let mediaRecorder, streamRef;
    let scrollInterval = null;
    let graphAnimId = null;

    let originalBpm = null;
    let realtimeBpm = null;
    let currentScrollSpeed = 1.0;

    let segmentsData = [];
    let trackDurationSec = 0;
    let baseOffsetSec = 0;
    let identifyTime = 0;
    let speedRatio = 1.0;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const realtimeBpmVal = document.getElementById('realtimeBpmVal');
    const originalBpmVal = document.getElementById('originalBpmVal');
    const lyricsBox = document.getElementById('lyricsBox');
    const albumArt = document.getElementById('albumArt');
    const syncRatioVal = document.getElementById('syncRatioVal');
    const canvas = document.getElementById('energyCanvas');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        streamRef = stream;
        
        // 1. リアルタイムBPM解析
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        microphone = audioCtx.createMediaStreamSource(stream);
        scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

        analyser.smoothingTimeConstant = 0.3;
        analyser.fftSize = 1024;

        microphone.connect(analyser);
        analyser.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);

        let threshold = 0.15;
        scriptNode.onaudioprocess = () => {
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);
          
          let sum = 0;
          for (let i = 0; i < 10; i++) sum += array[i];
          let average = sum / 10 / 255;

          const now = performance.now();
          if (average > threshold && (now - lastBeatTime) > 300) {
            if (lastBeatTime > 0) {
              const interval = now - lastBeatTime;
              beatIntervals.push(interval);
              if (beatIntervals.length > 8) beatIntervals.shift();
              
              const avgInterval = beatIntervals.reduce((a, b) => a + b) / beatIntervals.length;
              const calculated = Math.round(60000 / avgInterval);
              if (calculated >= 60 && calculated <= 190) {
                realtimeBpm = calculated;
                realtimeBpmVal.textContent = realtimeBpm;
                updateScrollSync();
              }
            }
            lastBeatTime = now;
          }
        };

        // 2. 楽曲識別 & 構造解析
        mediaRecorder = new MediaRecorder(stream);
        let chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          statusDiv.textContent = '楽曲識別 & 構造解析中...';
          const blob = new Blob(chunks, { type: 'audio/wav' });
          const formData = new FormData();
          formData.append('audio', blob, 'audio.wav');

          try {
            const res = await fetch('/api/identify', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
              document.getElementById('titleVal').textContent = data.title;
              document.getElementById('artistVal').textContent = data.artist;
              
              if (data.apiBpm && typeof data.apiBpm === 'number') {
                originalBpm = data.apiBpm;
                originalBpmVal.textContent = originalBpm;
              } else {
                originalBpmVal.textContent = '不明';
              }

              // アートワーク画像の表示切り替え
              if (data.albumArtUrl) {
                albumArt.src = data.albumArtUrl;
                albumArt.style.display = 'block';
              } else {
                albumArt.style.display = 'none';
              }

              lyricsBox.textContent = data.lyrics;

              // グラフデータの準備
              segmentsData = data.segments || [];
              trackDurationSec = data.trackDuration || (segmentsData.length ? segmentsData[segmentsData.length - 1].start + segmentsData[segmentsData.length - 1].duration : 180);
              baseOffsetSec = data.playOffset || 0;
              identifyTime = performance.now();

              updateScrollSync();
              startAutoScroll();
              renderEnergyGraph();

              statusDiv.textContent = '解析完了（同期スクロール実行中）';
            } else {
              statusDiv.textContent = '楽曲が認識できませんでした。';
            }
          } catch (err) {
            statusDiv.textContent = '識別エラーが発生しました。';
          }
        };

        mediaRecorder.start();
        statusDiv.textContent = 'マイク解析中... (楽曲識別中)';
        setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 5000);

        startBtn.disabled = true;
        stopBtn.disabled = false;

      } catch (err) {
        alert('マイクアクセスが拒否されたか利用できません。');
      }
    });

    stopBtn.addEventListener('click', () => {
      if (streamRef) streamRef.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      if (scrollInterval) clearInterval(scrollInterval);
      if (graphAnimId) cancelAnimationFrame(graphAnimId);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusDiv.textContent = '停止しました。';
    });

    function updateScrollSync() {
      const basePx = 0.8;
      if (originalBpm && realtimeBpm && originalBpm > 0) {
        speedRatio = realtimeBpm / originalBpm;
        currentScrollSpeed = basePx * speedRatio;
        syncRatioVal.textContent = `${speedRatio.toFixed(2)}x (BPM同期中)`;
      } else {
        speedRatio = 1.0;
        currentScrollSpeed = basePx;
        syncRatioVal.textContent = `1.00x (標準速度)`;
      }
    }

    function startAutoScroll() {
      if (scrollInterval) clearInterval(scrollInterval);
      scrollInterval = setInterval(() => {
        lyricsBox.scrollTop += currentScrollSpeed;
      }, 50);
    }

    function renderEnergyGraph() {
      if (graphAnimId) cancelAnimationFrame(graphAnimId);

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (segmentsData.length > 0 && trackDurationSec > 0) {
          segmentsData.forEach(seg => {
            const x = (seg.start / trackDurationSec) * canvas.width;
            const w = Math.max(1, (seg.duration / trackDurationSec) * canvas.width);
            const normLoudness = Math.max(0, Math.min(1, (seg.loudness + 60) / 60));
            const h = normLoudness * canvas.height;
            const y = canvas.height - h;

            ctx.fillStyle = `rgba(29, 185, 84, ${0.3 + normLoudness * 0.7})`;
            ctx.fillRect(x, y, w, h);
          });

          const elapsedSec = ((performance.now() - identifyTime) / 1000) * speedRatio;
          const currentPosSec = baseOffsetSec + elapsedSec;
          const markerX = (currentPosSec / trackDurationSec) * canvas.width;

          if (markerX <= canvas.width) {
            ctx.strokeStyle = '#ff3b30';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(markerX, 0);
            ctx.lineTo(markerX, canvas.height);
            ctx.stroke();

            ctx.fillStyle = '#ff3b30';
            ctx.beginPath();
            ctx.moveTo(markerX - 4, 0);
            ctx.lineTo(markerX + 4, 0);
            ctx.lineTo(markerX, 6);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = '#555';
          ctx.font = '12px sans-serif';
          ctx.fillText('構造データが取得できませんでした', 10, 35);
        }

        graphAnimId = requestAnimationFrame(draw);
      }

      draw();
    }
  </script>
</body>
</html>
