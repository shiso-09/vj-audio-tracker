<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VJ Audio & BPM Sync Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    button {
      background-color: #1db954;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    button:disabled { background-color: #555; }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }
    .bpm-box {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
    }
    .bpm-num { font-size: 2.8rem; font-weight: bold; color: #1db954; line-height: 1; margin-top: 4px; }
    .info-item { margin-bottom: 8px; }
    .info-label { font-size: 0.75rem; color: #aaa; }
    .info-value { font-size: 1.0rem; font-weight: 600; }
    
    .graph-container {
      margin-top: 6px;
      background: #000;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #333;
    }
    canvas {
      width: 100%;
      height: 60px;
      display: block;
    }

    .lyrics-wrapper {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      align-items: stretch;
    }
    .album-art {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #333;
      display: none;
      background-color: #222;
    }
    .lyrics-container {
      flex: 1;
      background: #000;
      border-radius: 8px;
      padding: 12px;
      height: 120px;
      overflow-y: auto;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #777;
      border: 1px solid #333;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    .lyric-line {
      margin-bottom: 8px;
      transition: color 0.2s ease, font-weight 0.2s ease, transform 0.2s ease;
    }
    .lyric-line.active {
      color: #1db954;
      font-weight: bold;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>VJ Audio Tracker</h1>

    <div class="btn-group">
      <button id="startBtn">解析開始</button>
      <button id="stopBtn" style="background-color: #e74c3c;" disabled>停止</button>
    </div>
    <div id="status" style="font-size:0.85rem; color:#aaa;">「解析開始」を押すとBPM・楽曲識別を開始します</div>

    <div class="card">
      <div class="bpm-box">
        <div class="info-label">マイクリアルタイムBPM</div>
        <div id="realtimeBpmVal" class="bpm-num">--</div>
      </div>

      <div class="info-item">
        <div class="info-label">曲名</div>
        <div id="titleVal" class="info-value">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">アーティスト</div>
        <div id="artistVal" class="info-value">-</div>
      </div>

      <div class="info-label" style="margin-top:10px;">エネルギー構造 & 現在再生位置</div>
      <div class="graph-container">
        <canvas id="energyCanvas" width="380" height="60"></canvas>
      </div>

      <div class="info-label" style="margin-top:10px;">自動同期歌詞</div>
      <div class="lyrics-wrapper">
        <img id="albumArt" class="album-art" src="" alt="Album Art">
        <div id="lyricsBox" class="lyrics-container">曲が識別されるとここに歌詞が表示されます。</div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx, analyser, microphone, lowpassFilter, scriptNode;
    let lastBeatTime = 0;
    let beatIntervals = [];
    let mediaRecorder, streamRef;
    let syncAnimId = null;

    let realtimeBpm = null;
    let segmentsData = [];
    let trackDurationSec = 0;
    let baseOffsetSec = 0;
    let identifyTime = 0;
    let parsedLyrics = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const realtimeBpmVal = document.getElementById('realtimeBpmVal');
    const lyricsBox = document.getElementById('lyricsBox');
    const albumArt = document.getElementById('albumArt');
    const canvas = document.getElementById('energyCanvas');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        streamRef = stream;
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        microphone = audioCtx.createMediaStreamSource(stream);

        // 低周波（キックドラム成分 140Hz以下）を抽出するローパスフィルター
        lowpassFilter = audioCtx.createBiquadFilter();
        lowpassFilter.type = 'lowpass';
        lowpassFilter.frequency.setValueAtTime(140, audioCtx.currentTime);

        scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
        analyser.smoothingTimeConstant = 0.8;
        analyser.fftSize = 512;

        microphone.connect(lowpassFilter);
        lowpassFilter.connect(analyser);
        analyser.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);

        let energyHistory = [];
        scriptNode.onaudioprocess = () => {
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);
          
          let sum = 0;
          for (let i = 0; i < array.length; i++) sum += array[i];
          let currentEnergy = sum / array.length;

          energyHistory.push(currentEnergy);
          if (energyHistory.length > 30) energyHistory.shift();
          const avgEnergy = energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length;

          const now = performance.now();
          // 動的閾値によるピーク検知
          if (currentEnergy > avgEnergy * 1.35 && currentEnergy > 15 && (now - lastBeatTime) > 320) {
            if (lastBeatTime > 0) {
              const interval = now - lastBeatTime;
              if (interval >= 330 && interval <= 1000) { // BPM 60 ~ 180の範囲
                beatIntervals.push(interval);
                if (beatIntervals.length > 10) beatIntervals.shift();
                
                // メディアン（中央値）フィルタで外れ値を除去してBPMを安定化
                const sorted = [...beatIntervals].sort((a, b) => a - b);
                const medianInterval = sorted[Math.floor(sorted.length / 2)];
                const calculated = Math.round(60000 / medianInterval);

                if (!realtimeBpm) {
                  realtimeBpm = calculated;
                } else {
                  // スルーレート制限（急激な変化を抑えてスムーズに追従）
                  realtimeBpm = Math.round(realtimeBpm * 0.7 + calculated * 0.3);
                }
                realtimeBpmVal.textContent = realtimeBpm;
              }
            }
            lastBeatTime = now;
          }
        };

        mediaRecorder = new MediaRecorder(stream);
        let chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          statusDiv.textContent = '楽曲識別 & 構造解析中...';
          const blob = new Blob(chunks, { type: 'audio/wav' });
          const formData = new FormData();
          formData.append('audio', blob, 'audio.wav');

          try {
            const res = await fetch('/api/identify', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
              document.getElementById('titleVal').textContent = data.title;
              document.getElementById('artistVal').textContent = data.artist;
              
              if (data.albumArtUrl) {
                albumArt.src = data.albumArtUrl;
                albumArt.style.display = 'block';
              } else {
                albumArt.style.display = 'none';
              }

              // 歌詞データのパースとレンダリング
              if (data.syncedLyrics) {
                parsedLyrics = parseLrc(data.syncedLyrics);
                renderSyncedLyrics(parsedLyrics);
              } else {
                parsedLyrics = [];
                lyricsBox.textContent = data.plainLyrics || '歌詞が見つかりませんでした。';
              }

              segmentsData = (data.segments && data.segments.length > 0) 
                ? data.segments 
                : generateFallbackSegments(data.trackDuration || 180);

              trackDurationSec = data.trackDuration || 180;
              baseOffsetSec = data.playOffset || 0;
              identifyTime = performance.now();

              startSyncLoop();
              statusDiv.textContent = '解析完了（同期表示中）';
            } else {
              statusDiv.textContent = '楽曲が認識できませんでした。';
            }
          } catch (err) {
            statusDiv.textContent = '識別エラーが発生しました。';
          }
        };

        mediaRecorder.start();
        statusDiv.textContent = 'マイク解析中... (楽曲識別中)';
        setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 5000);

        startBtn.disabled = true;
        stopBtn.disabled = false;

      } catch (err) {
        alert('マイクアクセスが拒否されたか利用できません。');
      }
    });

    stopBtn.addEventListener('click', () => {
      if (streamRef) streamRef.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      if (syncAnimId) cancelAnimationFrame(syncAnimId);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusDiv.textContent = '停止しました。';
    });

    // LRCタイムスタンプ文字列のパース処理 ([00:12.34] -> 秒数)
    function parseLrc(lrcText) {
      const lines = lrcText.split('\n');
      const result = [];
      const timeExp = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      lines.forEach((line, index) => {
        const match = timeExp.exec(line);
        if (match) {
          const min = parseInt(match[1]);
          const sec = parseInt(match[2]);
          const ms = parseFloat('0.' + match[3]);
          const time = min * 60 + sec + ms;
          const text = line.replace(timeExp, '').trim();
          if (text) {
            result.push({ time, text, index });
          }
        }
      });
      return result;
    }

    function renderSyncedLyrics(lyricsArray) {
      lyricsBox.innerHTML = '';
      lyricsArray.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `lyric-line-${idx}`;
        div.textContent = item.text;
        lyricsBox.appendChild(div);
      });
    }

    // 再生位置と同期した歌詞ハイライト＆自動スクロールループ
    function startSyncLoop() {
      if (syncAnimId) cancelAnimationFrame(syncAnimId);

      function loop() {
        const elapsedSec = (performance.now() - identifyTime) / 1000;
        const currentPosSec = baseOffsetSec + elapsedSec;

        // 1. 波形グラフィック更新
        drawEnergyGraph(currentPosSec);

        // 2. 歌詞同期＆スクロール更新
        if (parsedLyrics.length > 0) {
          let activeIndex = -1;
          for (let i = 0; i < parsedLyrics.length; i++) {
            if (currentPosSec >= parsedLyrics[i].time) {
              activeIndex = i;
            } else {
              break;
            }
          }

          if (activeIndex !== -1) {
            let currentActive = lyricsBox.querySelector('.lyric-line.active');
            let targetElem = document.getElementById(`lyric-line-${activeIndex}`);

            if (targetElem && currentActive !== targetElem) {
              if (currentActive) currentActive.classList.remove('active');
              targetElem.classList.add('active');

              // 「現在行 ＋ 2行先」が歌詞表示エリア内に綺麗に収まるようにスクロール位置を補正
              const targetAheadIndex = Math.min(activeIndex + 2, parsedLyrics.length - 1);
              const targetAheadElem = document.getElementById(`lyric-line-${targetAheadIndex}`);
              
              if (targetAheadElem) {
                const containerHeight = lyricsBox.clientHeight;
                const aheadElemBottom = targetAheadElem.offsetTop + targetAheadElem.offsetHeight;
                const desiredScrollTop = aheadElemBottom - containerHeight + 10;

                if (lyricsBox.scrollTop < desiredScrollTop || lyricsBox.scrollTop > targetElem.offsetTop) {
                  lyricsBox.scrollTo({ top: Math.max(0, desiredScrollTop), behavior: 'smooth' });
                }
              }
            }
          }
        }

        syncAnimId = requestAnimationFrame(loop);
      }

      loop();
    }

    function generateFallbackSegments(duration) {
      const segs = [];
      const step = 2;
      for (let t = 0; t < duration; t += step) {
        const progress = t / duration;
        let loudness = -30 + Math.sin(progress * Math.PI * 4) * 15 + Math.random() * 5;
        segs.push({ start: t, duration: step, loudness: loudness });
      }
      return segs;
    }

    function drawEnergyGraph(currentPosSec) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (segmentsData.length > 0 && trackDurationSec > 0) {
        segmentsData.forEach(seg => {
          const x = (seg.start / trackDurationSec) * canvas.width;
          const w = Math.max(1.5, (seg.duration / trackDurationSec) * canvas.width);
          const normLoudness = Math.max(0, Math.min(1, (seg.loudness + 60) / 60));
          const h = normLoudness * canvas.height;
          const y = canvas.height - h;

          ctx.fillStyle = `rgba(29, 185, 84, ${0.3 + normLoudness * 0.7})`;
          ctx.fillRect(x, y, w, h);
        });

        const markerX = (currentPosSec / trackDurationSec) * canvas.width;
        if (markerX <= canvas.width) {
          ctx.strokeStyle = '#ff3b30';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(markerX, 0);
          ctx.lineTo(markerX, canvas.height);
          ctx.stroke();

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.moveTo(markerX - 4, 0);
          ctx.lineTo(markerX + 4, 0);
          ctx.lineTo(markerX, 6);
          ctx.fill();
        }
      }
    }
  </script>
</body>
</html>
