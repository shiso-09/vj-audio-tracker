<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VJ Audio & Live Lyrics Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d11;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
      overflow-x: hidden;
      position: relative;
    }
    .bg-blur {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(0.25);
      z-index: -1;
      transition: background-image 1s ease-in-out;
    }
    .container {
      max-width: 460px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #8e8e93;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      background: linear-gradient(135deg, #1db954, #1aa34a);
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:active {
      transform: scale(0.96);
    }
    button:disabled {
      background: #333338;
      color: #777;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-danger {
      background: #e74c3c;
      box-shadow: none;
    }
    
    .status-text {
      font-size: 0.8rem;
      color: #a0a0a5;
      text-align: center;
      min-height: 1.2em;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .track-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .album-art {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
      display: none;
    }
    .track-info {
      flex: 1;
      overflow: hidden;
    }
    .track-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .track-artist {
      font-size: 0.95rem;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bpm-badge {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      background: rgba(29, 185, 84, 0.15);
      border: 1px solid rgba(29, 185, 84, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      align-self: flex-start;
    }
    .bpm-label {
      font-size: 0.75rem;
      color: #1db954;
      font-weight: 700;
      text-transform: uppercase;
    }
    .bpm-val {
      font-size: 1.4rem;
      font-weight: 900;
      color: #1db954;
    }

    .graph-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .graph-container {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    canvas {
      width: 100%;
      height: 55px;
      display: block;
    }

    .lyrics-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lyrics-container {
      position: relative;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 16px;
      height: 230px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .lyrics-container::-webkit-scrollbar {
      width: 4px;
    }
    .lyrics-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .lyric-line {
      font-size: 1.15rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.4;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
      filter: blur(0.5px);
    }
    .lyric-line.passed {
      color: rgba(255, 255, 255, 0.6);
      filter: none;
    }
    .lyric-line.active {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 900;
      transform: scale(1.02);
      filter: none;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 10px rgba(29, 185, 84, 0.4);
    }
  </style>
</head>
<body>
  <div id="bgBlur" class="bg-blur"></div>

  <div class="container">
    <header>
      <h1>VJ Live Audio Sync</h1>
      <div class="btn-group">
        <button id="startBtn">トラッキング開始</button>
        <button id="refreshBtn" class="btn-secondary" disabled>再識別</button>
        <button id="stopBtn" class="btn-danger" disabled>停止</button>
      </div>
    </header>

    <div id="status" class="status-text">「トラッキング開始」を押してマイク解析を始動します</div>

    <div class="card">
      <div class="track-header">
        <img id="albumArt" class="album-art" src="" alt="Album Art">
        <div class="track-info">
          <div id="titleVal" class="track-title">曲名未識別</div>
          <div id="artistVal" class="track-artist">アーティスト未識別</div>
        </div>
      </div>

      <div class="bpm-badge">
        <span class="bpm-label">Live BPM</span>
        <span id="realtimeBpmVal" class="bpm-val">--</span>
      </div>

      <div class="graph-section">
        <div class="section-title">AUDIO STRUCTURE & TRACK POSITION</div>
        <div class="graph-container">
          <canvas id="energyCanvas" width="400" height="55"></canvas>
        </div>
      </div>

      <div class="lyrics-section">
        <div class="section-title">LIVE SYNCED LYRICS</div>
        <div id="lyricsBox" class="lyrics-container">
          <div class="lyric-line active" style="font-size: 1.0rem; color: #8e8e93;">
            楽曲が識別されるとリアルタイム歌詞が表示されます。
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx, analyser, microphone, lowpassFilter, scriptNode;
    let lastBeatTime = 0;
    let beatIntervals = [];
    let mediaRecorder, streamRef;
    let syncAnimId = null;

    let realtimeBpm = null;
    let lastStableBpm = null;
    let bpmChangeCounter = 0;

    let segmentsData = [];
    let trackDurationSec = 0;
    let baseOffsetSec = 0;
    let recordStartTime = 0;
    let parsedLyrics = [];

    let autoRefreshTimer = null;
    let isIdentifying = false;
    const RECORD_DURATION_MS = 10000;

    const startBtn = document.getElementById('startBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const realtimeBpmVal = document.getElementById('realtimeBpmVal');
    const lyricsBox = document.getElementById('lyricsBox');
    const albumArt = document.getElementById('albumArt');
    const bgBlur = document.getElementById('bgBlur');
    const canvas = document.getElementById('energyCanvas');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        streamRef = stream;
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        microphone = audioCtx.createMediaStreamSource(stream);

        lowpassFilter = audioCtx.createBiquadFilter();
        lowpassFilter.type = 'lowpass';
        lowpassFilter.frequency.setValueAtTime(150, audioCtx.currentTime);

        scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
        analyser.smoothingTimeConstant = 0.8;
        analyser.fftSize = 512;

        microphone.connect(lowpassFilter);
        lowpassFilter.connect(analyser);
        analyser.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);

        let energyHistory = [];
        scriptNode.onaudioprocess = () => {
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);
          
          let sum = 0;
          for (let i = 0; i < array.length; i++) sum += array[i];
          let currentEnergy = sum / array.length;

          energyHistory.push(currentEnergy);
          if (energyHistory.length > 30) energyHistory.shift();
          const avgEnergy = energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length;

          const now = performance.now();
          if (currentEnergy > avgEnergy * 1.20 && currentEnergy > 8 && (now - lastBeatTime) > 300) {
            if (lastBeatTime > 0) {
              const interval = now - lastBeatTime;
              if (interval >= 330 && interval <= 1000) {
                beatIntervals.push(interval);
                if (beatIntervals.length > 10) beatIntervals.shift();
                
                const sorted = [...beatIntervals].sort((a, b) => a - b);
                const medianInterval = sorted[Math.floor(sorted.length / 2)];
                const calculated = Math.round(60000 / medianInterval);

                if (!realtimeBpm) {
                  realtimeBpm = calculated;
                  lastStableBpm = calculated;
                } else {
                  realtimeBpm = Math.round(realtimeBpm * 0.75 + calculated * 0.25);
                }
                realtimeBpmVal.textContent = realtimeBpm;

                if (lastStableBpm && Math.abs(realtimeBpm - lastStableBpm) / lastStableBpm > 0.15) {
                  bpmChangeCounter++;
                  if (bpmChangeCounter >= 4) {
                    bpmChangeCounter = 0;
                    lastStableBpm = realtimeBpm;
                    triggerIdentify('BPM変化検知のため自動更新中...');
                  }
                } else {
                  bpmChangeCounter = 0;
                }
              }
            }
            lastBeatTime = now;
          }
        };

        startBtn.disabled = true;
        refreshBtn.disabled = false;
        stopBtn.disabled = false;

        triggerIdentify('マイク音声解析中 (10秒間)...');

        autoRefreshTimer = setInterval(() => {
          triggerIdentify('定期自動更新中 (10秒間)...');
        }, 60000);

      } catch (err) {
        alert('マイクアクセスが拒否されたか利用できません。');
      }
    });

    refreshBtn.addEventListener('click', () => {
      triggerIdentify('手動更新中 (10秒間)...');
    });

    stopBtn.addEventListener('click', () => {
      if (streamRef) streamRef.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      if (syncAnimId) cancelAnimationFrame(syncAnimId);
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      startBtn.disabled = false;
      refreshBtn.disabled = true;
      stopBtn.disabled = true;
      statusDiv.textContent = 'トラッキングを停止しました。';
    });

    function triggerIdentify(statusMessage) {
      if (isIdentifying || !streamRef) return;
      isIdentifying = true;

      statusDiv.textContent = statusMessage;
      let chunks = [];
      mediaRecorder = new MediaRecorder(streamRef);
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      
      recordStartTime = performance.now();
      
      mediaRecorder.onstop = async () => {
        statusDiv.textContent = '楽曲識別 & 構造解析中...';
        const blob = new Blob(chunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append('audio', blob, 'audio.wav');

        try {
          const res = await fetch('/api/identify', { method: 'POST', body: formData });
          const data = await res.json();

          if (data.success) {
            document.getElementById('titleVal').textContent = data.title;
            document.getElementById('artistVal').textContent = data.artist;
            
            if (data.albumArtUrl) {
              albumArt.src = data.albumArtUrl;
              albumArt.style.display = 'block';
              bgBlur.style.backgroundImage = `url(${data.albumArtUrl})`;
            } else {
              albumArt.style.display = 'none';
            }

            if (data.syncedLyrics) {
              parsedLyrics = parseLrc(data.syncedLyrics);
              renderSyncedLyrics(parsedLyrics);
            } else {
              parsedLyrics = [];
              lyricsBox.innerHTML = `<div class="lyric-line active" style="font-size:1.0rem;">${data.plainLyrics || '歌詞が見つかりませんでした。'}</div>`;
            }

            segmentsData = (data.segments && data.segments.length > 0) 
              ? data.segments 
              : generateFallbackSegments(data.trackDuration || 180);

            trackDurationSec = data.trackDuration || 180;
            baseOffsetSec = data.playOffset || 0;

            startSyncLoop();
            statusDiv.textContent = 'トラッキング中（1分毎・BPM変化時に自動更新）';
          } else {
            statusDiv.textContent = '楽曲が認識できませんでした。次回更新まで待機中...';
          }
        } catch (err) {
          statusDiv.textContent = '識別エラーが発生しました。';
        } finally {
          isIdentifying = false;
        }
      };

      mediaRecorder.start();
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, RECORD_DURATION_MS);
    }

    function parseLrc(lrcText) {
      const lines = lrcText.split('\n');
      const result = [];
      const timeExp = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      lines.forEach((line, index) => {
        const match = timeExp.exec(line);
        if (match) {
          const min = parseInt(match[1]);
          const sec = parseInt(match[2]);
          const ms = parseFloat('0.' + match[3]);
          const time = min * 60 + sec + ms;
          const text = line.replace(timeExp, '').trim();
          if (text) {
            result.push({ time, text, index });
          }
        }
      });
      return result;
    }

    function renderSyncedLyrics(lyricsArray) {
      lyricsBox.innerHTML = '';
      lyricsArray.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `lyric-line-${idx}`;
        div.textContent = item.text;
        lyricsBox.appendChild(div);
      });
    }

    function startSyncLoop() {
      if (syncAnimId) cancelAnimationFrame(syncAnimId);

      function loop() {
        const elapsedSec = (performance.now() - recordStartTime) / 1000;
        const currentPosSec = baseOffsetSec + elapsedSec;

        drawEnergyGraph(currentPosSec);

        if (parsedLyrics.length > 0) {
          let activeIndex = -1;
          for (let i = 0; i < parsedLyrics.length; i++) {
            if (currentPosSec >= parsedLyrics[i].time) {
              activeIndex = i;
            } else {
              break;
            }
          }

          if (activeIndex !== -1) {
            let targetElem = document.getElementById(`lyric-line-${activeIndex}`);

            if (targetElem && !targetElem.classList.contains('active')) {
              parsedLyrics.forEach((_, idx) => {
                const elem = document.getElementById(`lyric-line-${idx}`);
                if (elem) {
                  elem.classList.remove('active', 'passed');
                  if (idx < activeIndex) {
                    elem.classList.add('passed');
                  } else if (idx === activeIndex) {
                    elem.classList.add('active');
                  }
                }
              });

              // ハイライト部分が歌詞窓の中央に正確に位置するようにスクロール位置を再計算
              const containerHeight = lyricsBox.clientHeight;
              const desiredScrollTop = targetElem.offsetTop - (containerHeight / 2) + (targetElem.clientHeight / 2);

              lyricsBox.scrollTo({ top: Math.max(0, desiredScrollTop), behavior: 'smooth' });
            }
          }
        }

        syncAnimId = requestAnimationFrame(loop);
      }

      loop();
    }

    function generateFallbackSegments(duration) {
      const segs = [];
      const step = 2;
      for (let t = 0; t < duration; t += step) {
        const progress = t / duration;
        let loudness = -30 + Math.sin(progress * Math.PI * 4) * 15 + Math.random() * 5;
        segs.push({ start: t, duration: step, loudness: loudness });
      }
      return segs;
    }

    function drawEnergyGraph(currentPosSec) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (segmentsData.length > 0 && trackDurationSec > 0) {
        segmentsData.forEach(seg => {
          const x = (seg.start / trackDurationSec) * canvas.width;
          const w = Math.max(1.5, (seg.duration / trackDurationSec) * canvas.width);
          const normLoudness = Math.max(0, Math.min(1, (seg.loudness + 60) / 60));
          const h = normLoudness * canvas.height;
          const y = canvas.height - h;

          ctx.fillStyle = `rgba(29, 185, 84, ${0.3 + normLoudness * 0.7})`;
          ctx.fillRect(x, y, w, h);
        });

        const markerX = (currentPosSec / trackDurationSec) * canvas.width;
        if (markerX <= canvas.width) {
          ctx.strokeStyle = '#ff3b30';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(markerX, 0);
          ctx.lineTo(markerX, canvas.height);
          ctx.stroke();

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.moveTo(markerX - 4, 0);
          ctx.lineTo(markerX + 4, 0);
          ctx.lineTo(markerX, 6);
          ctx.fill();
        }
      }
    }
  </script>
</body>
</html>
